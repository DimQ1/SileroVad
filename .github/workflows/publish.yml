# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
      - 'master'     # ... and to master, which is the default branch of this repository
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    needs: [ run_test ]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack --configuration Release --output ${{ env.NuGetDirectory }}  /p:GeneratePackageOnBuild=false

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  #validate_nuget:
  #  runs-on: ubuntu-latest
  #  needs: [ create_nuget ]
  #  steps:
      # Install the .NET SDK indicated in the global.json file
  #    - name: Setup .NET
  #      uses: actions/setup-dotnet@v3

      # Download the NuGet package created in the previous job
  #   - uses: actions/download-artifact@v3
  #      with:
  #        name: nuget
  #        path: ${{ env.NuGetDirectory }}

  #   - name: Install nuget validator
  #      run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
  #    - name: Validate package
  #      run: meziantou.validate-nuget-package (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg")

  run_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # the tests run on every target framework of the library, so all of their runtimes are needed
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Run tests
      run: dotnet test --configuration Release

  deploy:
    # Publish when a GitHub release is created, or when the workflow is run manually from the Actions
    # UI (useful to retry a publish that failed; --skip-duplicate makes that safe).
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [ create_nuget ]

    # Trusted publishing: GitHub issues a short-lived OIDC token that nuget.org exchanges for a
    # temporary API key, so no long-lived NUGET_APIKEY secret is needed any more.
    # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
    permissions:
      id-token: write
      contents: read

    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key. 'user' is the nuget.org
      # profile name and has to match a trusted publishing policy on nuget.org
      # (repository owner DimQ1, repository SileroVad, workflow file publish.yml).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: DimQ1

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

  gitnub_package:
      # Publish only when creating a GitHub Release, like the nuget.org job above
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-latest
      needs: [ create_nuget ]

      # GITHUB_TOKEN can push to GitHub Packages, so no personal access token is needed
      permissions:
        packages: write
        contents: read

      steps:
         #Push NuGet package to GitHub packages
      - name: Download nuget package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}
      - name: Prep packages
        run: dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/DimQ1/index.json"
      - name: Push package to GitHub packages 
        #if: needs.build.outputs.CommitsSinceVersionSource > 0 #Only release if there has been a commit/version change  
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key ${{ secrets.GITHUB_TOKEN }}  --source "github" --skip-duplicate
          }
